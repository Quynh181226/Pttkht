<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bệnh nhân | SmartCare Admin</title>
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .status-active { background: #d4edda; color: #2e7d32; padding: 4px 12px; border-radius: 20px; display: inline-block; }
        .status-locked { background: #eceff1; color: #546e7a; padding: 4px 12px; border-radius: 20px; display: inline-block; }
        .action-cell { white-space: nowrap; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-container { background: white; border-radius: 12px; width: 90%; max-width: 800px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
        .modal-header { padding: 16px 24px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; }
        .modal-body { padding: 24px; overflow-y: auto; max-height: calc(90vh - 120px); }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #e0e0e0; display: flex; justify-content: flex-end; gap: 12px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 180px; margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-group .required { color: #e74c3c; }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        .form-control.error { border-color: #dc2626; }
        .error-message { color: #dc2626; font-size: 13px; margin-top: 4px; }
        .btn-primary { background: #27ae60; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
        .btn-secondary { background: #95a5a6; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; }
        .toast-message { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; z-index: 10001; }
        .toast-message.success { background: #27ae60; }
        .toast-message.error { background: #dc2626; }
        .side-menu li a svg{
            font-size: 16px;
            min-width: 24px;
            margin-left: 10px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<!-- Sidebar + Header (giữ nguyên) -->
<section id="sidebar">
    <a href="#" class="brand"><i class="bx bx-capsule"></i><span class="text">SmartCare</span></a>
    <ul class="side-menu top">
        <li>
            <a th:href="@{/admin/dashboard}">
                <i class="bx bxs-dashboard"></i>
                <span class="text">Dashboard</span>
            </a>
        </li>

        <!-- CHUYÊN KHOA -->
        <li>
            <a th:href="@{/admin/specialties}">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="20"
                     height="20"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     style="min-width: 20px;">
                    <path d="M7 3a4 4 0 1 0 0 8 4 4 0 1 0 0-8M17 3a4 4 0 1 0 0 8 4 4 0 1 0 0-8M7 13a4 4 0 1 0 0 8 4 4 0 1 0 0-8M18 13h-2v3h-3v2h3v3h2v-3h3v-2h-3z"/>
                </svg>
                <span class="text">Chuyên khoa</span>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/doctors}">
                <i class="bx bxs-user-badge"></i>
                <span class="text">Bác sĩ</span>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/medicines}">
                <i class="bx bxs-capsule"></i>
                <span class="text">Thuốc</span>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/prescriptions}">
                <i class="bx bxs-receipt"></i>
                <span class="text">Đơn thuốc</span>
            </a>
        </li>

        <li class="active">
            <a th:href="@{/admin/users}">
                <i class="bx bxs-group"></i>
                <span class="text">Bệnh nhân</span>
            </a>
        </li>

        <!-- LỊCH HẸN -->
        <li>
            <a th:href="@{/admin/appointments}">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="20"
                     height="20"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     style="min-width: 20px;">
                    <path d="M4 2H2v19c0 .55.45 1 1 1h19v-2H4z"></path>
                    <path d="M7 10h11c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1H7c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1m10-2h-5V6h5zM8 6h2v2H8zM21 12H7c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h14c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1M8 14h6v2H8zm12 2h-4v-2h4z"></path>
                </svg>
                <span class="text">Lịch hẹn</span>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/statistics}">
                <i class="bx bxs-chart"></i>
                <span class="text">Thống kê</span>
            </a>
        </li>
    </ul>
    <ul class="side-menu">
        <li><a href="#"><i class="bx bxs-cog"></i><span class="text">Cài đặt</span></a></li>
        <li><a th:href="@{/logout}"><i class="bx bxs-log-out-circle"></i><span class="text">Đăng xuất</span></a></li>
    </ul>
</section>

<section id="content">
    <nav>
        <i class="bx bx-menu"></i>
        <div class="logo-admin">
            <input type="checkbox" id="switch-mode" hidden><label for="switch-mode" class="switch-mode"></label>
            <a href="#" class="notification"><i class="bx bxs-bell"></i><span class="num">8</span></a>
            <div class="profile-dropdown">
                <a href="#" class="profile" id="profileBtn">
                    <img th:src="${avatarUrl != null ? avatarUrl : 'https://randomuser.me/api/portraits/men/32.jpg'}" alt="avatar">
                </a>
                <div id="userMenuContainer" class="user-menu-dropdown" style="display: none;">
                    <div th:replace="~{fragments/user-menu :: userMenu}"></div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="head-title">
            <div class="left"><h1>Quản lý bệnh nhân</h1>
                <ul class="breadcrumb">
                    <li><a href="#">Bệnh nhân</a></li>
                    <li><i class="bx bx-chevron-right"></i></li>
                    <li><a class="active" href="#">Danh sách</a></li>
                </ul>
            </div>
        </div>

        <form th:action="@{/admin/users}" method="get" class="form-input">
            <input type="search" name="keyword" th:value="${param.keyword}" placeholder="Tìm kiếm bệnh nhân...">
            <button type="submit"><i class="bx bx-search"></i></button>
        </form>

        <div class="table-data">
            <div class="order">
                <div class="head"><h3>Danh sách bệnh nhân</h3></div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
<!--                            <th>Avatar</th>-->
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>SĐT</th>
                            <th>CCCD/CMND</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
<!--                            <td><img th:src="${u.avatarUrl != null ? u.avatarUrl : 'https://randomuser.me/api/portraits/lego/1.jpg'}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;"></td>-->
                            <td th:text="${u.fullName}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.phone}"></td>
                            <td th:text="${u.identityNumberHash}"></td>
                            <td class="action-cell">
                                <button class="edit-btn edit-open-btn"
                                        th:data-id="${u.id}"
                                        th:data-fullname="${u.fullName}"
                                        th:data-email="${u.email}"
                                        th:data-phone="${u.phone}"
                                        th:data-username="${u.username}"
                                        th:data-dob="${#temporals.format(u.dateOfBirth, 'yyyy-MM-dd')}"
                                        th:data-gender="${u.gender != null ? u.gender : 'other'}"
                                        th:data-province="${u.province}"
                                        th:data-district="${u.district}"
                                        th:data-ward="${u.ward}"
                                        th:data-address="${u.streetAddress}"
                                        th:data-insurance="${u.insuranceNumber}"
                                        th:data-code="${u.patientCode}"
                                        th:data-identity="${u.identityNumberHash}">
                                    <i class="bx bxs-pencil"></i> Sửa
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</section>

<!-- MODAL -->
<div id="userModal" class="modal-overlay" th:classappend="${openModal} ? 'active' : ''">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">Sửa bệnh nhân</h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <form id="userForm" th:action="@{/admin/users/save}" method="post" th:object="${userDTO}">
            <input type="hidden" name="id" id="editId" th:value="*{id}">

            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Họ và tên <span class="required">*</span></label>
                        <input type="text" name="fullName" id="fullName" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'error'" th:value="*{fullName}">
                        <div th:if="${#fields.hasErrors('fullName')}" class="error-message" th:errors="*{fullName}"></div>
                    </div>
                    <div class="form-group">
                        <label>Tên đăng nhập <span class="required">*</span></label>
                        <input type="text" name="username" id="username" class="form-control" th:value="*{username}" readonly>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" name="email" id="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'error'" th:value="*{email}">
                        <div th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}"></div>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại <span class="required">*</span></label>
                        <input type="tel" name="phone" id="phone" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'error'" th:value="*{phone}">
                        <div th:if="${#fields.hasErrors('phone')}" class="error-message" th:errors="*{phone}"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Số CCCD/CMND <span class="required">*</span></label>
                        <input type="text" name="identityNumberHash" id="identityNumberHash" class="form-control" th:classappend="${#fields.hasErrors('identityNumberHash')} ? 'error'" th:value="*{identityNumberHash}">
                        <div th:if="${#fields.hasErrors('identityNumberHash')}" class="error-message" th:errors="*{identityNumberHash}"></div>
                    </div>
                    <div class="form-group">
                        <label>Số BHYT</label>
                        <input type="text" name="insuranceNumber" id="insuranceNumber" class="form-control" th:value="*{insuranceNumber}">
                    </div>
                </div>

                <!-- Các trường khác -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Ngày sinh</label>
                        <input type="date" name="dateOfBirth" id="dateOfBirth" class="form-control" th:value="*{dateOfBirth}">
                    </div>
                    <div class="form-group">
                        <label>Giới tính</label>
<!--                        <select name="gender" id="gender" class="form-control">-->
<!--                            <option value="male" th:selected="${userDTO?.gender?.name() == 'male'}">Nam</option>-->
<!--                            <option value="female" th:selected="${userDTO?.gender?.name() == 'female'}">Nữ</option>-->
<!--                            <option value="other" th:selected="${userDTO?.gender?.name() == 'other'}">Khác</option>-->
<!--                        </select>-->
                        <select name="gender" id="gender" class="form-control">
                            <option value="male">Nam</option>
                            <option value="female">Nữ</option>
                            <option value="other">Khác</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Địa chỉ</label>
                    <div class="form-row">
                        <input type="text" name="province" id="province" class="form-control" placeholder="Tỉnh/Thành phố" th:value="*{province}">
                        <input type="text" name="district" id="district" class="form-control" placeholder="Quận/Huyện" th:value="*{district}">
                    </div>
                    <div class="form-row">
                        <input type="text" name="ward" id="ward" class="form-control" placeholder="Phường/Xã" th:value="*{ward}">
                        <input type="text" name="streetAddress" id="streetAddress" class="form-control" placeholder="Số nhà, đường" th:value="*{streetAddress}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Mã bệnh nhân</label>
                        <input type="text" name="patientCode" id="patientCode" class="form-control" th:value="*{patientCode}" readonly>
                    </div>
<!--                    <div class="form-group">-->
<!--                        <label>Ảnh đại diện (URL)</label>-->
<!--                        <input type="text" name="avatarUrl" id="avatarUrl" class="form-control" th:value="*{avatarUrl}">-->
<!--                    </div>-->
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Hủy</button>
                <button type="submit" class="btn-primary">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>

<script>
    function showToast(msg, type) {
        var toast = document.createElement('div');
        toast.className = 'toast-message ' + type;
        toast.innerHTML = '<i class="bx ' + (type === 'success' ? 'bx-check-circle' : 'bx-error-circle') + '"></i> ' + msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function closeModal() {
        document.getElementById('userModal').classList.remove('active');
    }

    // Edit button
    document.querySelectorAll('.edit-open-btn').forEach(function(btn) {
        btn.onclick = function() {
            document.getElementById('modalTitle').innerText = 'Sửa bệnh nhân';
            document.getElementById('editId').value = this.getAttribute('data-id');
            document.getElementById('fullName').value = this.getAttribute('data-fullname') || '';
            document.getElementById('username').value = this.getAttribute('data-username') || '';
            document.getElementById('email').value = this.getAttribute('data-email') || '';
            document.getElementById('phone').value = this.getAttribute('data-phone') || '';
            document.getElementById('dateOfBirth').value = this.getAttribute('data-dob') || '';
            document.getElementById('gender').value = this.getAttribute('data-gender') || 'other';
            document.getElementById('province').value = this.getAttribute('data-province') || '';
            document.getElementById('district').value = this.getAttribute('data-district') || '';
            document.getElementById('ward').value = this.getAttribute('data-ward') || '';
            document.getElementById('streetAddress').value = this.getAttribute('data-address') || '';
            document.getElementById('insuranceNumber').value = this.getAttribute('data-insurance') || '';
            document.getElementById('patientCode').value = this.getAttribute('data-code') || '';
            document.getElementById('identityNumberHash').value = this.getAttribute('data-identity') || '';

            document.getElementById('userModal').classList.add('active');
        };
    });

    // Sidebar scripts...
    const profileBtn = document.getElementById('profileBtn');
    const userMenu = document.getElementById('userMenuContainer');
    if (profileBtn && userMenu) {
        profileBtn.addEventListener('click', (e) => {
            e.preventDefault();
            userMenu.style.display = userMenu.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', () => userMenu.style.display = 'none');
        userMenu.addEventListener('click', e => e.stopPropagation());
    }

    const switchMode = document.getElementById('switch-mode');
    if (localStorage.getItem('darkMode') === 'true') {
        switchMode.checked = true;
        document.body.classList.add('dark');
    }
    switchMode?.addEventListener('change', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', switchMode.checked);
    });

    const menuBar = document.querySelector('#content nav .bx-menu');
    const sidebar = document.getElementById('sidebar');
    if (localStorage.getItem('sidebarHide') === 'true') sidebar.classList.add('hide');
    menuBar?.addEventListener('click', () => {
        sidebar.classList.toggle('hide');
        localStorage.setItem('sidebarHide', sidebar.classList.contains('hide'));
    });
</script>

<th:block th:if="${success != null}"><script>showToast([[${success}]], 'success');</script></th:block>
<th:block th:if="${error != null}"><script>showToast([[${error}]], 'error');</script></th:block>

</body>
</html>
