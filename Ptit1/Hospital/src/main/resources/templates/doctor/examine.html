<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám bệnh | SmartCare</title>
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">
<!--    <link rel="stylesheet" href="style.css">  -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .exam-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .exam-section { background: var(--card-bg); border-radius: 20px; padding: 24px; }
        .exam-section h3 { margin-bottom: 20px; font-size: 20px; }
        .form-row { margin-bottom: 16px; }
        .form-row label { display: block; margin-bottom: 6px; font-weight: 500; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: var(--card-bg); }
        .medicine-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .medicine-item select { flex: 2; min-width: 150px; }
        .medicine-item input { width: 80px; }
        .medicine-list { margin-top: 16px; border-top: 1px solid #eee; padding-top: 16px; }
        .medicine-list-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .action-buttons { display: flex; gap: 16px; justify-content: flex-end; margin-top: 24px; }
        @media (max-width: 768px) { .exam-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<section id="sidebar">
    <a href="#" class="brand"><i class="bx bx-capsule"></i><span class="text">SmartCare</span></a>
    <ul class="side-menu top">
        <li><a th:href="@{/doctor/dashboard}"><i class="bx bxs-dashboard"></i><span class="text">Dashboard</span></a></li>
        <li><a th:href="@{/doctor/waiting-list}"><i class="bx bxs-group"></i><span class="text">Chờ khám</span></a></li>
        <li><a th:href="@{/doctor/medical-history}"><i class="bx bxs-folder-open"></i><span class="text">Bệnh nhân đã khám</span></a></li>
    </ul>
    <ul class="side-menu">
        <li><a href="#"><i class="bx bxs-cog"></i><span class="text">Cài đặt</span></a></li>
        <li><a th:href="@{/logout}"><i class="bx bxs-log-out-circle"></i><span class="text">Đăng xuất</span></a></li>
    </ul>
</section>

<section id="content">
    <nav>
        <i class="bx bx-menu"></i>
        <div class="logo-admin">
            <input type="checkbox" id="switch-mode" hidden><label for="switch-mode" class="switch-mode"></label>
            <a href="#" class="notification"><i class="bx bxs-bell"></i><span class="num">3</span></a>
            <div class="profile-dropdown" style="position: relative;">
                <a href="#" class="profile" id="profileBtn">
                    <img th:src="${session.avatarUrl != null ? session.avatarUrl : 'https://randomuser.me/api/portraits/men/32.jpg'}" alt="avatar">
                </a>
                <div id="userMenuContainer" style="position: absolute; top: 45px; right: 0; z-index: 100; display: none;">
                    <div th:replace="~{fragments/user-menu :: userMenu}"></div>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="head-title">
            <div class="left"><h1>Khám bệnh cho: <span th:text="${appointment.patient.fullName}"></span></h1>
                <ul class="breadcrumb"><li><a href="#">Khám</a></li><li><i class="bx bx-chevron-right"></i></li><li><a class="active" href="#">Nhập kết quả</a></li></ul>
            </div>
        </div>

        <form th:action="@{/doctor/examine/save}" method="post">
            <input type="hidden" name="appointmentId" th:value="${appointment.id}">

            <div class="exam-container">
                <!-- TRIỆU CHỨNG & CHẨN ĐOÁN -->
                <div class="exam-section">
                    <h3><i class="bx bx-news"></i> Thông tin khám bệnh</h3>
                    <div class="form-row">
                        <label>Triệu chứng</label>
                        <textarea name="symptoms" rows="3" class="form-control" required></textarea>
                    </div>
                    <div class="form-row">
                        <label>Chẩn đoán</label>
                        <textarea name="diagnosis" rows="3" class="form-control" required></textarea>
                    </div>
                    <div class="form-row">
                        <label>Kết luận</label>
                        <textarea name="conclusion" rows="2" class="form-control"></textarea>
                    </div>
                </div>

                <!-- KÊ ĐƠN THUỐC (dynamic) -->
                <div class="exam-section">
                    <h3><i class="bx bxs-capsule"></i> Kê đơn thuốc</h3>
                    <div class="medicine-item">
                        <select id="medicineSelect">
                            <option value="">Chọn thuốc</option>
                            <option th:each="m : ${medicines}" th:value="${m.id}" th:text="${m.name + ' - ' + #numbers.formatDecimal(m.unitPrice, 0, 0, 'COMMA') + 'đ'}"></option>
                        </select>
                        <input type="number" id="medicineQty" placeholder="SL" min="1" value="1" style="width:80px">
                        <input type="text" id="medicineDosage" placeholder="Liều dùng" style="width:120px">
                        <button type="button" class="edit-btn" onclick="addMedicine()">+ Thêm</button>
                    </div>

                    <div class="medicine-list" id="medicineList">
                        <div class="medicine-list-item" style="color:var(--text-muted); font-size:13px">
                            <span>Tên thuốc</span><span>Số lượng</span><span>Liều dùng</span><span></span>
                        </div>
                    </div>

                    <div class="form-row" style="margin-top:16px">
                        <label>Hướng dẫn sử dụng chung</label>
                        <textarea id="instruction" name="instruction" rows="2" class="form-control" placeholder="Ví dụ: Ngày uống 2 lần, mỗi lần 1 viên..."></textarea>
                    </div>

                    <!-- Hidden inputs để gửi danh sách thuốc -->
                    <div id="hiddenFields"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button type="button" class="secondary-btn" onclick="history.back()">Hủy bỏ</button>
                <button type="submit" class="primary-btn"><i class="bx bxs-save"></i> Lưu bệnh án & Kê đơn</button>
            </div>
        </form>
    </main>
</section>

<script>
    let medicines = []; // lưu {id, name, quantity, dosage}

    function addMedicine() {
        let select = document.getElementById("medicineSelect");
        let medicineId = select.value;
        let medicineName = select.options[select.selectedIndex]?.text.split(' - ')[0];
        let qty = parseInt(document.getElementById("medicineQty").value);
        let dosage = document.getElementById("medicineDosage").value;

        if(!medicineId || qty < 1) { alert("Vui lòng chọn thuốc và nhập số lượng"); return; }

        let existing = medicines.find(m => m.id == medicineId);
        if(existing) { existing.quantity += qty; }
        else { medicines.push({ id: medicineId, name: medicineName, quantity: qty, dosage: dosage }); }

        renderMedicineList();
        document.getElementById("medicineSelect").value = "";
        document.getElementById("medicineQty").value = "1";
        document.getElementById("medicineDosage").value = "";
    }

    function removeMedicine(index) {
        medicines.splice(index, 1);
        renderMedicineList();
    }

    function renderMedicineList() {
        let container = document.getElementById("medicineList");
        container.innerHTML = `<div class="medicine-list-item" style="color:var(--text-muted); font-size:13px">
                                    <span>Tên thuốc</span><span>Số lượng</span><span>Liều dùng</span><span></span>
                                </div>`;
        medicines.forEach((m, idx) => {
            container.innerHTML += `<div class="medicine-list-item">
                <span><strong>${m.name}</strong></span>
                <span>${m.quantity}</span>
                <span>${m.dosage || ''}</span>
                <span><button type="button" class="btn-danger" onclick="removeMedicine(${idx})">Xóa</button></span>
            </div>`;
        });
        if(medicines.length === 0) {
            container.innerHTML += `<div class="medicine-list-item" style="color:var(--text-muted); text-align:center">Chưa có thuốc nào được thêm</div>`;
        }

        // Tạo hidden inputs để gửi lên server
        let hiddenDiv = document.getElementById("hiddenFields");
        hiddenDiv.innerHTML = "";
        medicines.forEach((m, idx) => {
            hiddenDiv.innerHTML += `<input type="hidden" name="medicineIds" value="${m.id}">
                                    <input type="hidden" name="quantities" value="${m.quantity}">
                                    <input type="hidden" name="dosages" value="${m.dosage || ''}">`;
        });
    }

    const profileBtn = document.getElementById('profileBtn');
    const userMenuContainer = document.getElementById('userMenuContainer');
    if (profileBtn && userMenuContainer) {
        profileBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            userMenuContainer.style.display = userMenuContainer.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', () => { userMenuContainer.style.display = 'none'; });
        userMenuContainer.addEventListener('click', (e) => { e.stopPropagation(); });
    }

    const switchMode = document.getElementById("switch-mode");
    if (localStorage.getItem("darkMode") === "true") { switchMode.checked = true; document.body.classList.add("dark"); }
    switchMode.addEventListener("change", () => { document.body.classList.toggle("dark"); localStorage.setItem("darkMode", switchMode.checked); });
    const menuBar = document.querySelector("#content nav .bx-menu"); const sidebar = document.getElementById("sidebar");
    if (localStorage.getItem("sidebarHide") === "true") sidebar.classList.add("hide");
    menuBar.addEventListener("click", () => { sidebar.classList.toggle("hide"); localStorage.setItem("sidebarHide", sidebar.classList.contains("hide")); });
</script>
</body>
</html>
