<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử khám | SmartCare</title>
    <link href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style1.css}">
    <style>
        .content { margin: 40px; }
        .order { background: white; border-radius: 20px; padding: 24px; overflow-x: auto; }
        .order table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .order table th, .order table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .status-completed { background: #d4edda; color: #2e7d32; padding: 4px 12px; border-radius: 20px; display: inline-block; font-size: 12px; }
        .head-title { margin-bottom: 24px; }
        .head-title .left h1 { font-size: 36px; font-weight: 600; }
        .breadcrumb { display: flex; align-items: center; gap: 16px; }
        .breadcrumb li { list-style: none; }
        .breadcrumb li a { color: #999; text-decoration: none; }
        .breadcrumb li a.active { color: #E5101B; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="content">
    <main>
        <div class="head-title">
            <div class="left">
                <h1>Lịch sử khám bệnh</h1>
                <ul class="breadcrumb">
                    <li><a href="#">Khám</a></li>
                    <li><i class="bx bx-chevron-right"></i></li>
                    <li><a class="active" href="#">Lịch sử</a></li>
                </ul>
            </div>
        </div>

        <div class="order">
            <h3>Danh sách các lần khám</h3>
            <table>
                <thead>
                <tr><th>Ngày khám</th><th>Bác sĩ</th><th>Chuyên khoa</th><th>Lý do</th><th>Trạng thái</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${#temporals.format(a.appointmentDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${a.doctor.user.fullName}"></td>
                    <td th:text="${a.doctor.specialty.name}"></td>
                    <td th:text="${a.reason}"></td>
                    <td><span class="status-completed">Đã khám</span></td>
                </tr>
                <tr th:if="${appointments.isEmpty()}">
                    <td colspan="5" style="text-align:center">Chưa có lịch sử khám nào</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</section>

<script>
    const switchMode = document.getElementById("switch-mode");
    if (localStorage.getItem("darkMode") === "true") { if(switchMode) switchMode.checked = true; document.body.classList.add("dark"); }
</script>
</body>
</html>
