<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Berkshire+Swash&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .not-found-container {
            min-height: 100vh;
            background: lightsteelblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 16px;
        }

        .error-code {
            font-size: 8rem;
            font-family: 'Berkshire Swash', cursive;
            color: white;
            margin-bottom: 8px;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .title {
            font-size: 24px;
            color: #f1f5f9;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .description {
            color: #e5e7eb;
            max-width: 600px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .home-btn {
            cursor: pointer;
            padding: 12px 24px;
            background: #9fb6ce;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #d1d5db;
        }

        .footer {
            margin-top: 120px;
            color: #6b7280;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="not-found-container">
    <h1 class="error-code">404</h1>

    <h2 class="title">
        Trang bạn tìm kiếm không tồn tại
    </h2>

    <p class="description">
        Có thể liên kết bị sai, trang đã bị xóa hoặc bạn nhập sai địa chỉ.
        Hãy quay lại trang chủ để tiếp tục khám phá nội dung.
    </p>

    <button
            class="home-btn"
            onclick="window.location.href='/'"
    >
        Quay lại trang chủ
    </button>

    <div class="footer">
        &copy; Ncc.Com - Bản quyền thuộc Công ty TNHH Công Nghệ Ncc
    </div>
</div>

</body>
</html>
