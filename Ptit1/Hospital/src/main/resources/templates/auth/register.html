<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Healthcare - Đăng ký</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            font-family: system-ui, 'Segoe UI', sans-serif;
        }

        .modal-enter {
            animation: fadeScaleIn 0.25s ease-out;
        }

        @keyframes fadeScaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 24px;
        }

        input:focus {
            outline: none;
        }

        input.error,
        select.error,
        textarea.error {
            border-color: #E5101B !important;
            background-color: #fff5f5 !important;
        }

        .error-message {
            color: #E5101B;
            font-size: 13px;
            margin-top: 4px;
            display: block;
        }

        .input-group {
            position: relative;
            margin-top: 10px;
        }

        .input-group label {
            position: absolute;
            top: -10px;
            left: 16px;
            background: white;
            padding: 0 8px;
            font-size: 14px;
            color: #6B7280;
            z-index: 2;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            height: 56px;
            border: 2px solid #7C86A5;
            border-radius: 16px;
            padding: 0 18px;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #5E6A8A;
            box-shadow: 0 0 0 3px rgba(94, 106, 138, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #6B7597;
        }

        .submit-btn {
            color: white;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div id="registerModal" class="fixed inset-0 z-[999] flex items-center justify-center">

        <!-- Overlay -->
        <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-md" id="modalBg"></div>

        <!-- Box -->
        <div class="relative w-[75%] md:w-[555px] bg-white border border-gray-200 rounded-2xl shadow-2xl modal-enter overflow-hidden">

            <!-- HEADER -->
            <div class="modal-header">

                <h2 class="text-xl font-semibold text-gray-900">
                    Smart Care User - Đăng ký
                </h2>

                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 transition-colors" onclick="closeModal()">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body">

                <!-- Error -->
                <div th:if="${error != null}"
                     class="mb-6 p-4 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl flex items-start">

                    <i class="fas fa-exclamation-circle mt-0.5 mr-3"></i>

                    <span th:text="${error}"></span>
                </div>

                <!-- FORM -->
                <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="space-y-6" novalidate>
                    <!--<span th:errors="*{confirmPassword}"></span>-->
                    <div class="input-group">
                        <label for="fullName">Họ và tên</label>
                        <input type="text" id="fullName" th:field="*{fullName}">

                        <div th:if="${#fields.hasErrors('fullName')}" class="error-message">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${#fields.errors('fullName')[0]}"></span>   <!-- Chỉ lấy lỗi đầu tiên -->
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text" id="username" th:field="*{username}">

                        <div th:if="${#fields.hasErrors('username')}" class="error-message">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${#fields.errors('username')[0]}"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}">

                        <div th:if="${#fields.hasErrors('email')}" class="error-message">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${#fields.errors('email')[0]}"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="tel" id="phone" th:field="*{phone}">

                        <div th:if="${#fields.hasErrors('phone')}" class="error-message">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${#fields.errors('phone')[0]}"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Mật khẩu</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" th:field="*{password}" class="pr-12">
                            <i class="fas fa-eye-slash toggle-password togglePwd"></i>
                        </div>
                        <div th:if="${#fields.hasErrors('password')}" class="error-message">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${#fields.errors('password')[0]}"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Xác nhận mật khẩu</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="pr-12">
                            <i class="fas fa-eye-slash toggle-password togglePwdConfirm"></i>
                        </div>
                        <div th:if="${#fields.hasErrors('confirmPassword')}" class="error-message">
                            <i class="fas fa-exclamation-circle mr-1"></i>
                            <span th:text="${#fields.errors('confirmPassword')[0]}"></span>
                        </div>
                    </div>

                    <div class="flex items-start gap-3">
                        <input type="checkbox" th:field="*{agreeTerms}" id="agreeTerms" class="cursor-pointer w-4 h-4 mt-0.5 accent-[#6B7597]">
                        <label for="agreeTerms" class="text-sm text-gray-600 cursor-pointer">
                            Tôi đồng ý với
                            <a href="#" class="text-[#B0000D] hover:underline">
                                Điều khoản sử dụng
                            </a>
                            và
                            <a href="#" class="text-[#B0000D] hover:underline">
                                Chính sách bảo mật
                            </a>
                        </label>
                    </div>

                    <div th:if="${#fields.hasErrors('agreeTerms')}" class="error-message">
                        <i class="fas fa-exclamation-circle mr-1"></i>
                        <span th:errors="*{agreeTerms}"></span>
                    </div>

                    <button type="submit" class="submit-btn cursor-pointer w-full mt-2 py-3 rounded-full font-medium bg-gradient-to-r from-[#5E6A8A] to-[#6B7597] hover:brightness-110 active:scale-95 transition-all">
                        Đăng ký
                    </button>

                    <p class="text-center text-sm text-gray-600 mt-4">
                        Đã có tài khoản?
                        <a href="/login" class="text-[#6B7597] hover:text-[#4F5A7A] font-medium transition-colors">
                            Đăng nhập
                        </a>
                    </p>
                </form>
            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    function closeModal() {
        window.location.href = '/'
    }

    $('.togglePwd').click(function () {
        const input = $(this).siblings('input')

        const type =
            input.attr('type') === 'password'
                ? 'text'
                : 'password'

        input.attr('type', type)

        $(this).toggleClass('fa-eye-slash fa-eye')
    })

    $('.togglePwdConfirm').click(function () {
        const input = $(this).siblings('input')

        const type =
            input.attr('type') === 'password'
                ? 'text'
                : 'password'

        input.attr('type', type)

        $(this).toggleClass('fa-eye-slash fa-eye')
    })

    $('#modalBg').click(closeModal)
</script>

</body>
</html>
