<div th:fragment="userMenu"
     style="min-width: 260px;
            background: var(--card-bg, white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 12px 0;">

    <div style="display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 16px;">

        <img th:src="${session.avatarUrl != null ? session.avatarUrl : 'https://randomuser.me/api/portraits/men/32.jpg'}"
             alt="Avatar"
             style="width: 48px;
                    height: 48px;
                    border-radius: 50%;
                    object-fit: cover;">

        <div>
            <h4 th:text="${session.userName}"
                style="margin: 0;
                       font-size: 15px;
                       font-weight: 600;">
                User
            </h4>

            <span th:text="${session.userEmail}"
                  style="font-size: 12px;
                         color: var(--text-muted, #666);">
                email@example.com
            </span>
        </div>
    </div>

    <div style="height: 1px;
                background: var(--border-color, #e0e0e0);
                margin: 8px 0;">
    </div>

    <a th:href="@{/profile}"
       style="display: flex;
              align-items: center;
              gap: 12px;
              padding: 10px 16px;
              color: var(--text-color, #333);
              text-decoration: none;
              font-size: 14px;">

        <i class="bx bx-user"
           style="font-size: 18px;
                  width: 20px;"></i>

        <span>Thông tin cá nhân</span>
    </a>

    <a th:href="@{/change-password}"
       style="display: flex;
              align-items: center;
              gap: 12px;
              padding: 10px 16px;
              color: var(--text-color, #333);
              text-decoration: none;
              font-size: 14px;">

        <i class="bx bx-lock"
           style="font-size: 18px;
                  width: 20px;"></i>

        <span>Đổi mật khẩu</span>
    </a>

    <div style="height: 1px;
                background: var(--border-color, #e0e0e0);
                margin: 8px 0;">
    </div>

    <a href="#"
       onclick="event.preventDefault(); document.getElementById('logoutForm').submit();"
       style="display: flex;
              align-items: center;
              gap: 12px;
              padding: 10px 16px;
              color: #dc3545;
              text-decoration: none;
              font-size: 14px;">

        <i class="bx bx-log-out"
           style="font-size: 18px;
                  width: 20px;"></i>

        <span>Đăng xuất</span>
    </a>

    <form id="logoutForm"
          th:action="@{/logout}"
          method="post"
          style="display: none;">
    </form>
</div>
