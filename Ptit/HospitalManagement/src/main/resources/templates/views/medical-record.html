<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Bệnh án</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 30px; }
    h1 { color: #333; margin-bottom: 20px; border-left: 5px solid #667eea; padding-left: 15px; }
    .info-card { background: #f8f9fa; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .info-row { display: flex; margin-bottom: 10px; }
    .info-label { width: 150px; font-weight: bold; color: #555; }
    .info-value { flex: 1; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
    th { background: #667eea; color: white; }
    .btn-back { background: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 20px; }
    .btn-back:hover { background: #5a6268; }
    .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .status-completed { background: #28a745; color: white; }
  </style>
</head>
<body>
<div class="container">
  <h1>📋 BỆNH ÁN</h1>

  <div class="info-card">
    <div class="info-row">
      <div class="info-label">Mã bệnh án:</div>
      <div class="info-value" th:text="${medicalRecord.id}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Bệnh nhân:</div>
      <div class="info-value" th:text="${medicalRecord.appointment.patient.fullName}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Bác sĩ:</div>
      <div class="info-value" th:text="${medicalRecord.appointment.doctor.fullName}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Khoa:</div>
      <div class="info-value" th:text="${medicalRecord.appointment.department.name}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Ngày khám:</div>
      <div class="info-value" th:text="${#temporals.format(medicalRecord.appointment.appointmentDate, 'dd/MM/yyyy HH:mm')}">-</div>
    </div>
  </div>

  <div class="info-card">
    <h3>🩺 Chẩn đoán & Điều trị</h3>
    <div class="info-row">
      <div class="info-label">Chẩn đoán:</div>
      <div class="info-value" th:text="${medicalRecord.diagnosis}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Triệu chứng:</div>
      <div class="info-value" th:text="${medicalRecord.symptoms}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Ghi chú:</div>
      <div class="info-value" th:text="${medicalRecord.notes}">-</div>
    </div>
    <div class="info-row">
      <div class="info-label">Tái khám:</div>
      <div class="info-value" th:if="${medicalRecord.followUpDate}" th:text="${#temporals.format(medicalRecord.followUpDate, 'dd/MM/yyyy')}">-</div>
      <div class="info-value" th:unless="${medicalRecord.followUpDate}">Không hẹn tái khám</div>
    </div>
  </div>

  <div class="info-card">
    <h3>💊 Đơn thuốc</h3>
    <table th:if="${not #lists.isEmpty(medicalRecord.prescriptions)}">
      <thead>
      <tr>
        <th>STT</th>
        <th>Tên thuốc</th>
        <th>Số lượng</th>
        <th>Liều dùng</th>
        <th>Số ngày</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="detail, iterStat : ${medicalRecord.prescriptions}">
        <td th:text="${iterStat.index + 1}">1</td>
        <td th:text="${detail.drug.name}">-</td>
        <td th:text="${detail.quantity}">-</td>
        <td th:text="${detail.dosage}">-</td>
        <td th:text="${detail.durationDays}">-</td>
      </tr>
      </tbody>
    </table>
    <p th:unless="${not #lists.isEmpty(medicalRecord.prescriptions)}" style="color: #999;">Chưa có đơn thuốc</p>
  </div>

  <a href="/doctor/patients" class="btn-back">← Quay lại danh sách</a>
</div>
</body>
</html>
