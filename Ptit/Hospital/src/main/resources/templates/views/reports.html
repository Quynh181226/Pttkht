<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <h2>Báo cáo tổng hợp</h2>
    <form method="get" class="form-row">
        <input type="date" name="from" th:value="${from}"><input type="date" name="to" th:value="${to}">
        <button type="submit" class="btn btn-primary">Xem báo cáo</button>
    </form>
    <div class="stats-grid">
        <div class="stat-card"><div class="number" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA')}">0</div><div class="label">Tổng doanh thu (VND)</div></div>
        <div class="stat-card"><div class="number" th:text="${totalAppointments}">0</div><div class="label">Tổng lịch hẹn</div></div>
        <div class="stat-card"><div class="number" th:text="${totalPatients}">0</div><div class="label">Tổng bệnh nhân</div></div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
