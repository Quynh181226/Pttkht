<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>

<div th:replace="fragments/header :: header"></div>

<section class="page-hero">
    <div class="container page-hero-content">
        <div>
            <h1>Đăng ký tài khoản</h1>
            <p>Tạo tài khoản để quản lý lịch hẹn và hồ sơ sức khỏe của bạn.</p>
        </div>
    </div>
</section>

<div class="container">
    <div class="form-card">
        <h2 style="text-align:center; color:#1e3a5f;">Đăng ký tài khoản</h2>

        <div th:if="${message}" class="alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form action="/register" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" name="fullname" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Số điện thoại *</label>
                    <input type="tel" name="phone" required class="form-control" pattern="\d{10,15}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="form-group">
                    <label>Mật khẩu *</label>
                    <input type="password" name="password" required class="form-control" minlength="6">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" name="dob" class="form-control">
                </div>
                <div class="form-group">
                    <label>Giới tính</label>
                    <select name="gender" class="form-control">
                        <option value="MALE">Nam</option>
                        <option value="FEMALE">Nữ</option>
                        <option value="OTHER">Khác</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>CCCD/CMND</label>
                    <input type="text" name="identityNo" class="form-control">
                </div>
                <div class="form-group">
                    <label>Số BHYT</label>
                    <input type="text" name="insuranceNo" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label>Địa chỉ</label>
                <textarea name="address" rows="3" class="form-control"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Đăng ký</button>
        </form>

        <div style="text-align:center; margin-top: 20px;">
            <a href="/login">Đã có tài khoản? Đăng nhập</a>
        </div>
    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
