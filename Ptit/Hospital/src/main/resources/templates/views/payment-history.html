<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<div th:replace="fragments/header :: header"></div>

<section class="page-hero">
    <div class="container page-hero-content">
        <div><h1>Lịch sử thanh toán</h1><p>Xem lịch sử hóa đơn và thanh toán viện phí.</p></div>
    </div>
</section>

<div class="container">
    <div class="form-card wide">
        <h2 style="text-align:center; color:#1e3a5f;">Hóa đơn viện phí</h2>
        <div th:if="${#lists.isEmpty(invoices)}" class="alert-error">Bạn chưa có hóa đơn nào.</div>
        <div th:unless="${#lists.isEmpty(invoices)}" class="table-container">
            <table class="data-table">
                <thead><tr><th>Mã hóa đơn</th><th>Ngày khám</th><th>Tổng tiền</th><th>BHYT</th><th>Bệnh nhân trả</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead>
                <tbody>
                <tr th:each="inv : ${invoices}">
                    <td th:text="${inv.id}"></td><td th:text="${#temporals.format(inv.appointment.appointmentDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#numbers.formatDecimal(inv.totalAmount, 0, 'COMMA')} + ' VND'"></td>
                    <td th:text="${inv.appointment.insuranceNo != null ? 'Có' : 'Không'}"></td>
                    <td th:text="${#numbers.formatDecimal(inv.patientPay, 0, 'COMMA')} + ' VND'"></td>
                    <td><span class="badge badge-completed" th:text="${inv.status == 'PAID' ? 'Đã thanh toán' : 'Chưa thanh toán'}"></span></td>
                    <td><a th:href="'/invoice/view/' + ${inv.id}" class="btn btn-outline">Xem</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
