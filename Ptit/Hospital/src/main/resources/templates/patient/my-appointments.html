<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<section class="page-hero">
    <div class="container page-hero-content">
        <div>
            <h1>Lịch hẹn của tôi</h1>
            <p>Danh sách lịch hẹn và trạng thái điều trị.</p>
        </div>
    </div>
</section>

<div class="container">
    <div class="form-card wide">
        <h2 style="text-align:center; color:#1e3a5f;">Lịch hẹn của tôi</h2>
        <div class="table-container">
            <table class="data-table">
                <thead>
                <tr><th>Bác sĩ</th><th>Ngày</th><th>Ca</th><th>Triệu chứng</th><th>Trạng thái</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${a.doctorName}"></td>
                    <td th:text="${a.appointmentDate}"></td>
                    <td th:text="${a.slot}"></td>
                    <td th:text="${a.symptoms}"></td>
                    <td th:text="${a.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
